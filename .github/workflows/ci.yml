name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: tailor
          POSTGRES_USER: tailor
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tailor -d tailor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tailor:ci-test-password@localhost:5432/tailor?schema=public
      TEST_DATABASE_URL: postgresql://tailor:ci-test-password@localhost:5432/tailor?schema=public
      ALLOW_SHARED_TEST_DATABASE: "true"
      RUN_DB_TESTS: "true"
      # NOTE: NODE_ENV stays unset at job level. With NODE_ENV=test, Vite
      # bundles the development React build (~1.6x larger), which broke the
      # bundle budget and never matched production. Test steps opt in below.
    steps:
      - uses: actions/checkout@v4
      # F-011: the four @tailor/shared copies must stay byte-identical.
      - name: Check shared contract drift
        run: node tools/check-shared-drift.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      # Per-workspace typechecks; tsc errors are echoed as ::error workflow
      # commands so they surface as check annotations (readable via the API).
      - name: Typecheck shared
        shell: bash
        run: |
          set -o pipefail
          { npm run build --workspace @tailor/shared && npm run typecheck --workspace @tailor/shared; } 2>&1 | sed -u -E 's/^([^[:space:]()]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)/::error file=\1,line=\2,col=\3::\4: \5/'
      - name: Typecheck api
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck --workspace @tailor/api 2>&1 | sed -u -E 's/^([^[:space:]()]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)/::error file=\1,line=\2,col=\3::\4: \5/'
      - name: Typecheck web
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck --workspace @tailor/web 2>&1 | sed -u -E 's/^([^[:space:]()]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)/::error file=\1,line=\2,col=\3::\4: \5/'
      - name: Typecheck mobile
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck --workspace @tailor/mobile 2>&1 | sed -u -E 's/^([^[:space:]()]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)/::error file=\1,line=\2,col=\3::\4: \5/'
      - run: npm run lint --workspace @tailor/web
      # Backend suite: failing TAP lines are echoed as ::error workflow
      # commands so they surface as check annotations (readable via the API).
      - name: Test backend
        shell: bash
        env:
          NODE_ENV: test
        run: |
          set -o pipefail
          npm test 2>&1 | sed -u -E -e 's/.*not ok [0-9]+ - (.*)/::error::FAIL: \1/' -e 's/^ +error: (.*)/::error::  error: \1/' -e 's/.*(#[[:space:]]*(fail|pass|tests)[[:space:]]+[0-9]+.*)/::error::SUMMARY \1/' -e 's/.*((Error|TypeError|ReferenceError) \[[A-Z_]+\].*)/::error::CRASH: \1/' -e 's/.*(AssertionError.*)/::error::ASSERT: \1/' -e 's/.*(Cannot find module[^,]*)/::error::MODULE: \1/' -e 's/^ +(actual|expected|operator): (.*)/::error::  \1: \2/'
      - run: npm run test --workspace @tailor/web
        env:
          NODE_ENV: test
      - run: npm run test --workspace @tailor/mobile
        env:
          NODE_ENV: test
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Check web bundle budget
        shell: bash
        run: |
          node tools/check-web-bundle.mjs || { echo '--- bundle check output ---'; node tools/check-web-bundle.mjs 2>&1 | sed -u -E 's/(.*)/::error::BUNDLE \1/'; exit 1; }
      - run: npm audit --workspace @tailor/api --workspace @tailor/web --workspace @tailor/shared





